# RCBot2 Bot Profile 1
# Profile files are loaded in order: 1.ini, 2.ini, 3.ini, etc.

# Bot name (displayed in game)
name "RCBot"

# Player model (for HL2DM: models/humans/Group03/Male_01.mdl, etc.)
model "default"

# Team preference (-1 = any, for team-based games)
team -1

# Class preference (-1 = any, for class-based games like TF2)
class -1

# Vision ticks - how often the bot scans for enemies (lower = more CPU, better reactions)
visionticks 16

# Vision ticks for clients specifically
visionticks_clients 10

# Path ticks - how often the bot recalculates paths (lower = more CPU, smoother movement)
pathticks 30

# Mouse sensitivity equivalent (affects aim speed)
sensitivity 8

# Aim skill (0-100, higher = more accurate)
aim_skill 70

# Braveness (0-100, higher = more aggressive)
braveness 70
